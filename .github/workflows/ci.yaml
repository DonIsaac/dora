name: CI

on:
  pull_request:
  push:
    branches: ["main"]

env:
  ZIG_VERSION: 0.17.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        uses: DonIsaac/zlint-action@main

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, x86-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check
        run: zig build check -Dtarget=${{ matrix.target }} --summary all

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: native
            flags: -Dtsan
          # 32-bit. TSAN is unsupported here.
          - target: x86-linux-musl
            flags: ""
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Test
        run: zig build test -Dtarget=${{ matrix.target }} ${{ matrix.flags }} --summary all

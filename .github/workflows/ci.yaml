name: CI

on:
  pull_request:
  push:
    branches: ["main"]

env:
  ZIG_VERSION: 0.17.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        uses: DonIsaac/zlint-action@main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check
        run: zig build check --summary all
      - name: Test
        run: zig build test -Dtsan --summary all


